<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>My first three.js app</title>
    <link rel="stylesheet" href="css/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  </head>
  <body>
    <canvas id="bg"></canvas>
    <main>
      <div class="navbar">
        <a href="#default" class="logo">Oscar Castillejo</a>
        <div class="header-sections">
          <a class="active" href="#hero">Home</a>
          <a href="#projects">Projects</a>
          <a href="#about">About</a>
        </div>
        <div class="">
          Social Media
        </div>
      </div>
      <section id="hero">
        <p>Software Engineer</p>
        <div class="glass-element toggleControls" id="controls_div">Controls</div>
      </section>
      <section id="projects">
        <h2 style="margin-top: 0;">Projects</h2>
        <div class="card">Forklift Racing Game</div>
        <div class="card">Procedural Track Generator</div>
      </section>
      <section id="about">
        <h2>About Me</h2>
        <p>Short description...</p>
      </section>

      
    </main>
    <div class="glass-element hidden" id="joystick-zone">
      <div id="ctrl-zone">
        <div class="stick-zone" id="move-zone"></div>
        <div class="stick-zone" id="fork-zone"></div>
      </div> 
    </div>
    <div id="onJoystickToggle" class="toggleControls"><svg class="glass-elements" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path fill="#fff" d="M300.3 440.8C312.9 451 331.4 450.3 343.1 438.6L471.1 310.6C480.3 301.4 483 287.7 478 275.7C473 263.7 461.4 256 448.5 256L192.5 256C179.6 256 167.9 263.8 162.9 275.8C157.9 287.8 160.7 301.5 169.9 310.6L297.9 438.6L300.3 440.8z"/></svg></div>
    <script type="module" src="./js/main.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script> -->
  </body>
</html>
